# The website (static build) can be hosted on Netlify. The API in server/ runs
# as a separate Node.js service; see SUPER_ADMIN_SETUP.md.
[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward /api to the API server so the site and API share one origin.
# Replace the host with where the API is deployed.
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.example.com/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
