name: Hostinger deployment check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build:
    name: Build web app for Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and API
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-production-build
          path: |
            dist
            server/dist
          if-no-files-found: error
          retention-days: 7
